# Ergates ingress: the only published ports of the stack. docker-compose.yml
# publishes them on the VPS's Tailscale IP; here each is forwarded as plain
# TCP (WebSockets included) to its service on the `internal` network, which
# has no route out and so cannot publish ports itself.

global
    log stdout format raw local0

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

# Docker's embedded DNS, so a restarted service's new address is found.
resolvers docker
    nameserver dns 127.0.0.11:53

frontend hermes_serve
    bind :9119
    default_backend hermes_serve

backend hermes_serve
    server serve hermes-serve:9119 resolvers docker init-addr last,libc,none

frontend ntfy
    bind :8080
    default_backend ntfy

backend ntfy
    server ntfy ntfy:80 resolvers docker init-addr last,libc,none
