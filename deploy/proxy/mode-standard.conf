# Standard egress mode (the default; EGRESS_MODE unset also means this
# one): HTTPS and plain HTTP to any public host, nothing private. Included
# by squid.conf as /etc/squid/mode.conf when EGRESS_MODE is unset or
# "standard" (docker-compose.yml).
#
# This is what makes a fresh install, and Hermes's `browser` toolset (any
# website), work without editing a file first. The honest risk is in
# deploy/README.md "Egress and ingress": this mode cannot tell a legitimate
# request to a public host apart from one a hostile web page talked an
# agent into making. What it blocks is a request reaching something more
# damaging than the public internet: the VPS's own services, the Docker
# host, cloud metadata, or another device on the operator's tailnet.

# Every private, internal or special-use destination, denied before any
# allow below. `dst` matches the IP Squid actually connects to, so a
# hostname that resolves to one of these ranges is denied exactly like a
# literal IP typed directly.
acl private_dst dst 0.0.0.0/8
acl private_dst dst 10.0.0.0/8
acl private_dst dst 100.64.0.0/10
acl private_dst dst 127.0.0.0/8
acl private_dst dst 169.254.0.0/16
acl private_dst dst 172.16.0.0/12
acl private_dst dst 192.168.0.0/16
acl private_dst dst 192.0.0.0/24
acl private_dst dst 198.18.0.0/15
acl private_dst dst 224.0.0.0/4
acl private_dst dst 240.0.0.0/4
acl private_dst dst ::1/128
acl private_dst dst ::/128
acl private_dst dst ::ffff:0:0/96
acl private_dst dst 64:ff9b::/96
acl private_dst dst fc00::/7
acl private_dst dst fe80::/10
acl private_dst dst ff00::/8

# HTTPS (a CONNECT tunnel to 443) and plain HTTP (port 80); every other
# port stays denied.
acl standard_ports port 80 443

http_access deny private_dst
http_access deny !standard_ports
http_access allow all
