# Strict egress mode: today's exact behavior, kept for an owner who wants
# an allowlist instead of standard mode's open-by-default rule. Included by
# squid.conf as /etc/squid/mode.conf when EGRESS_MODE=strict
# (docker-compose.yml).
#
# Allows one thing: an HTTPS tunnel (CONNECT to port 443) to a host listed,
# one per line, in allowed-domains.txt. Everything else is denied: plain
# HTTP, other ports, unlisted hosts, and IP addresses (-n: no DNS lookups,
# so an IP never matches a listed name).

acl allowed_hosts dstdomain -n "/etc/squid/allowed-domains.txt"
acl https_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !https_port
http_access allow allowed_hosts
http_access deny all
