# Ergates egress proxy. The controllers and ntfy have no network path out
# except this proxy (docker-compose.yml: the `internal` network). It allows one
# thing: an HTTPS tunnel (CONNECT to port 443) to a host listed, one per
# line, in allowed-domains.txt. Everything else is denied: plain HTTP, other
# ports, unlisted hosts, and IP addresses (-n: no DNS lookups, so an IP never
# matches a listed name).
#
# This file replaces the image's whole configuration and includes none of its
# conf.d files: the image's debian.conf allows every local network.

http_port 3128

acl allowed_hosts dstdomain -n "/etc/squid/allowed-domains.txt"
acl https_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !https_port
http_access allow allowed_hosts
http_access deny all

# A tunnel is opaque: nothing to cache.
cache deny all

# The image sets this in conf.d/rock.conf, which is not included, so that
# Squid does not size itself from the host's open-file limit (LP: #1978272).
max_filedescriptors 1024

# Logs stay at Squid's defaults under /var/log/squid. The image's entrypoint
# follows access.log onto the container output, so `docker compose logs
# egress-proxy` shows one line per request. Do not log to stdio:/dev/stdout:
# Squid opens its logs after dropping to the `proxy` user, which cannot open
# the container's output (a pipe owned by root), and a log it cannot open
# stops it at start.
