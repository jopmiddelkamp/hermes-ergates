# Ergates egress proxy. The controllers and ntfy have no route out except
# this proxy (docker-compose.yml: the `internal` network). It allows one
# thing: an HTTPS tunnel (CONNECT to port 443) to a host listed, one per
# line, in allowed-domains.txt. Everything else is denied: plain HTTP, other
# ports, unlisted hosts, and IP addresses (-n: no DNS lookups, so an IP never
# matches a listed name).

http_port 3128

acl allowed_hosts dstdomain -n "/etc/squid/allowed-domains.txt"
acl https_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !https_port
http_access allow allowed_hosts
http_access deny all

# A tunnel is opaque: nothing to cache.
cache deny all

# One line per request on the container's output (`docker compose logs egress-proxy`).
access_log stdio:/dev/stdout
