# Ergates egress proxy. The controllers and ntfy have no network path out
# except this proxy (docker-compose.yml: the `internal` network).
#
# This file holds only the settings shared by both egress modes; what is
# allowed and denied lives in one mode file, included below and chosen by
# EGRESS_MODE in .env (deploy/README.md "Egress and ingress"):
#   - mode-standard.conf: any public host, private and special-use ranges
#     denied (the default; EGRESS_MODE unset also means this one).
#   - mode-strict.conf: an HTTPS tunnel to a host listed in
#     allowed-domains.txt only (today's exact behavior).
# docker-compose.yml mounts ./proxy/mode-${EGRESS_MODE:-standard}.conf at
# the path this file includes, with create_host_path: false, so a mistyped
# EGRESS_MODE fails `docker compose up` instead of Docker silently creating
# an empty directory there.
#
# This file replaces the image's whole configuration and includes none of
# its conf.d files: the image's debian.conf allows every local network. The
# only include below is our own mode split, never one of the image's.

http_port 3128

include /etc/squid/mode.conf

# A tunnel is opaque: nothing to cache.
cache deny all

# The image sets this in conf.d/rock.conf, which is not included, so that
# Squid does not size itself from the host's open-file limit (LP: #1978272).
max_filedescriptors 1024

# Logs stay at Squid's defaults under /var/log/squid. The image's entrypoint
# follows access.log onto the container output, so `docker compose logs
# egress-proxy` shows one line per request. Do not log to stdio:/dev/stdout:
# Squid opens its logs after dropping to the `proxy` user, which cannot open
# the container's output (a pipe owned by root), and a log it cannot open
# stops it at start.
