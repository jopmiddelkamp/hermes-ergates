# Concierge profile -- the default/launch profile for the Ergates deployment.
#
# Keys below are the "verified keys" from docs/03-technical-design.md
# section 9 -- confirmed to exist and mean what this file assumes. This is
# intentionally an incomplete profile: per 03 section 9, "This excerpt omits
# the reviewed workspace volumes, effective toolsets and MCP include lists;
# a profile is not ready until those are configured and tested." Do not
# deploy this file as-is; fill in the sections marked TODO after the P0
# spike proves them, and see deploy/README.md for the full unverified-gates
# list.

gateway:
  # Only the default/launch profile sets this. It makes hermes-gateway serve
  # every specialist profile (and their cron stores) from one process --
  # specialist profiles themselves must NOT repeat this key (03 section 9).
  multiplex_profiles: true

terminal:
  backend: docker
  container_persistent: true
  container_cpu: 1
  container_memory: 1024
  container_disk: 5120
  docker_shared_container_key: ""
  # Never true by default (04 section 7): shell sandboxes get no network
  # unless this is deliberately revisited with an isolated, allowlisted
  # network -- see 03 section 9's note on egress separation.
  docker_network: false
  docker_forward_env: []

approvals:
  mode: manual
  timeout: 1800
  cron_mode: deny
  unattended_mode: deny

# TODO (P0, not yet configured/tested -- 03 section 9):
#   - Workspace volumes: an explicit, reviewed host<->container path mapping
#     for this profile's persistent workspace. Never mount the whole Hermes
#     data root into a shell sandbox.
#   - Effective toolset: the concierge's actual tool/connector allowlist,
#     including the ergates_propose_agent tool from integrations/ergates.
#   - MCP include list: which MCP servers this profile may reach.
#   - ntfy routing: the topic/token this profile's attention hooks publish
#     to (see integrations/ergates/README.md "Configuration").
