# Specialist profile template -- copy this into a new profile per specialist,
# never edit a specialist's config by hand outside the reviewed provisioning
# path (docs/11-implementation-readiness.md section 4.1: "The integration
# drives the supported profile operations ... Resolve provider credentials
# on the server; do not copy a concierge .env or clone all of its rights.").
#
# Keys below are the "verified keys" from docs/03-technical-design.md
# section 9. This is intentionally an incomplete profile: workspace
# volumes, the effective toolset and MCP include list are per-specialist and
# are a P0 deliverable, not something a static template can supply -- see
# deploy/VERIFY.md for the full live-checks list.

# No `gateway.multiplex_profiles` key here: that setting belongs only to the
# default/launch profile (deploy/profiles/concierge/config.yaml), which
# already serves every specialist profile's cron store.

terminal:
  backend: docker
  container_persistent: true
  container_cpu: 1
  container_memory: 1024
  container_disk: 5120
  docker_shared_container_key: ""
  docker_network: false
  docker_forward_env: []

approvals:
  mode: manual
  timeout: 1800
  cron_mode: deny
  unattended_mode: deny

# Hermes loads the plugin in a profile only when that profile enables it.
# The app's provisioning and `python -m ergates.install` both do this; it is
# here so a profile made by hand from this file starts with it.
plugins:
  enabled:
    - ergates

