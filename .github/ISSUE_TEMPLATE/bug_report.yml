name: Bug report
description: Report something that isn't working as expected.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before you file it, remove any access tokens, session tokens, or other secrets from anything you paste in below — screenshots and logs included.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger it, in order.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The Ergates app version (Settings, or the TestFlight/Play build number).
      placeholder: "0.3.0 (42)"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Server (Hermes / Ergates integration)
    validations:
      required: true
  - type: input
    id: hermes-version
    attributes:
      label: Hermes version
      description: The Hermes Agent version or commit your server runs, if this involves the server.
      placeholder: "v0.21.2"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste any relevant log output. This is rendered as code automatically, no need for backticks.

        **Remove any access tokens, session tokens, or other secrets before pasting.**
      render: shell
    validations:
      required: false
