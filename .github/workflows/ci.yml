# Every job runs scripts/ci-local.sh, so a local run executes the same commands.
name: CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: scripts/ci-local.sh lint

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: scripts/ci-local.sh mobile

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: scripts/ci-local.sh integration

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out Hermes at the pin
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: d76856cc6971b6e0e1903b5369498bcc4bb83a60
          path: .cache/hermes-pin
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: scripts/ci-local.sh contract
        env:
          HERMES_SOURCE: ${{ github.workspace }}/.cache/hermes-pin

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: scripts/ci-local.sh deploy
