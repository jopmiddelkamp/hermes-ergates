# Reusable: builds the signed Android App Bundle of a store release
# (apps/mobile/RELEASING.md). release.yml calls it. The job runs in the
# app-stores environment and reads that environment's secrets itself: a caller
# cannot pass environment secrets to a reusable workflow.
name: Release build Android

on:
  workflow_call:
    inputs:
      build-number:
        description: Android versionCode
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: app-stores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # React Native recommends JDK 17 for Android builds.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      # Catches a full disk (the runner's 14 GB SSD, docs.github.com
      # "GitHub-hosted runners" reference) at the point it starts mattering,
      # instead of a mid-build failure whose real cause is easy to miss.
      - name: Check available disk space
        run: df -h
      - name: Build the signed App Bundle
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ inputs.build-number }}
          OUTPUT_DIR: ${{ runner.temp }}/release
          # ubuntu-latest (public repo) has 16 GB RAM (docs.github.com,
          # "GitHub-hosted runners" reference). Left unbounded, the
          # --no-daemon Gradle JVM and the AAPT2/R8/Kotlin worker processes it
          # spawns can each size their own heap off the full 16 GB and get
          # OOM-killed under combined pressure with npm and the Node prebuild
          # step; -Xmx4g bounds the Gradle JVM and leaves headroom for them.
          GRADLE_OPTS: -Xmx4g
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: scripts/release/build-android.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release
          path: ${{ runner.temp }}/release/ergates.aab
          if-no-files-found: error
          retention-days: 14
