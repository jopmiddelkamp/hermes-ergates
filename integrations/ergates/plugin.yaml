name: ergates
label: Ergates
version: 0.1.0
description: >-
  Agent proposal tooling and background attention/push notifications for the
  Ergates mobile companion: records agent proposals, approval requests and
  finished routine turns in one SQLite control store, and publishes their
  pushes to ntfy.
provides_tools:
  - ergates_propose_agent
provides_hooks:
  - pre_approval_request
  - post_approval_response
  - post_llm_call
