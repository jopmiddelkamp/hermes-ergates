name: ergates
label: Ergates
version: 0.2.0
description: >-
  Server side of the Ergates mobile companion: agent proposals, reminders that
  a retry never duplicates, a tool gate, and approval and finished-routine
  pushes to ntfy, all recorded in one SQLite control store.
provides_tools:
  - ergates_propose_agent
  - ergates_create_reminder
provides_hooks:
  - pre_tool_call
  - pre_approval_request
  - post_approval_response
  - post_llm_call
