[project]
name = "ergates"
version = "0.1.0"
description = "Ergates integration package for Hermes Agent: agent proposals, reminders, and attention/push notifications."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Runtime stays standard-library only (see dependencies = [] above). PyYAML is a
# *test* dependency: `python -m ergates.flush` parses the profile's config.yaml
# so no credential ever reaches a command line, and it imports yaml lazily from
# the Hermes runtime, which ships it.
test = ["pytest>=7.4", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ergates*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
